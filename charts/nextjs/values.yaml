# The new values file provided by the user.
revisionHistoryLimit: 1
replicaCount: 1
deploymentPort: 3000

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ''

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

env:
  configMap:
    PORT: '3000'
  # secrets are matched to an .env file (secrets.env) in the helm directory
  # values are base64 encoded automatically (see secrets.env.example)
  # secrets:
  #   - FOO
  #   - BAR

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ''

podAnnotations: {}

podSecurityContext:
  {}
  # fsGroup: 2000

securityContext:
  {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ''
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #   - secretName: chart-example-tls
  #     hosts:
  #       - chart-example.local

# Routing on the Gateway instead of nginx. Turn ingress.enabled off in the same
# change: the chart refuses to render both, since they would claim the same
# hostnames. Backends stay plain HTTP; TLS ends at the Gateway.
httpRoute:
  enabled: false
  # Points at the Gateway the argocd repo deploys from core-resources/gateway:
  # release fc-gw, namespace fc-gateway, listener https.
  gateway:
    name: fc-gw
    namespace: fc-gateway
    sectionName: https
  hostnames: []
  # Empty uses service.port.
  port: ''
  timeout: ''
  requestHeaders: {}
  # Empty routes the whole site. Each entry: path, and optionally
  # rewritePrefix, timeout, requestHeaders.
  rules: []
  # A route accepts at most 16 hostnames, so a longer list is split across as
  # many routes as it needs and each gets a numbered suffix. Nothing to maintain
  # here: add the 17th hostname and the split happens, and a list that fits
  # keeps the plain release name.
  #
  # routes is for the other case, where one route will not do because rules
  # apply to every hostname on it and some of these need a different path. Set
  # this instead of hostnames and rules above, not as well. Each entry:
  # hostnames, and optionally name, rules, timeout, requestHeaders. name is
  # suffixed to the release name, and one entry may leave it out.
  #
  #   routes:
  #     - hostnames: [a.example.com]
  #     - name: borrowerportal
  #       hostnames: [b.example.com]
  #       rules:
  #         - path: /borrowerportal
  routes: []
  # Several routes for one app, for when a single one will not hold what it
  # serves: more than the 16 hostnames an HTTPRoute accepts, or two groups of
  # hostnames needing different paths, since rules apply to every hostname on
  # their route. Set this instead of hostnames and rules above, not as well.
  # Each entry: hostnames, and optionally name, rules, timeout, requestHeaders.
  # name is suffixed to the release name, and one entry may leave it out.
  #
  #   routes:
  #     - hostnames: [a.example.com]
  #     - name: borrowerportal
  #       hostnames: [b.example.com]
  #       rules:
  #         - path: /borrowerportal
  routes: []

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
