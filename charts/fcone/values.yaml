# Default values for nestjs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

revisionHistoryLimit: 1
replicaCount: 1
deploymentPort: 3000

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

env:
  configMap:
    PORT: "3000"
    NO_COLOR: "1"
#  Secrets are fetched from KeyVault - Name in KeyVault should match the key and Name in the application should match
#  the value. Names in KV should NOT contain underscore `_`
#  secrets:
#    kv_secret_name: app_secret
#    kv_secret_name_2: app_secret

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: 443
      name: https

ingress:
  # Legacy ingress configuration (backward compatible)
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

  # New public ingress configuration
  public:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  # New private ingress configuration
  private:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx-private
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example-private.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-private-tls
    #    hosts:
    #      - chart-example-private.local

# Routing for this app, owned by this app. The gateway chart keeps the Gateway,
# its listeners and its certificate; the hostnames an app answers on live here.
#
# The same hostnames drive the IIS bindings, so a route cannot name a host the
# container has no binding for. That mismatch is invisible until the gateway
# verifies the backend certificate and the handshake fails, so it is derived
# rather than repeated.
#
#   gateway            the Gateway to attach to, and which listener
#   hostnames          public names this app answers on
#   backendTLSHostname name checked against the backend certificate,
#                      defaults to the first hostname
#   backendTLS         verify the backend certificate, on by default
#   caCertRefName      ConfigMap holding ca.crt, distributed by trust-manager
#   port               backend Service port, defaults to service.port
#   timeout            total time a request may take
#   requestHeaders     headers set before the request reaches the backend
#   rules              path rules, defaults to one prefix match on /
#   manageWebsiteBindings
#                      derive the WEBSITE- IIS bindings from hostnames. Turn off
#                      only for an app that names its bindings by hand.
httpRoute:
  enabled: false
  gateway:
    name: fc-gw
    namespace: fc-gateway
    sectionName: https
  hostnames: []
  backendTLSHostname: ""
  backendTLS: true
  useSystemCAs: false
  caCertRefName: internal-ca-bundle
  caCertRefKind: ConfigMap
  port: ""
  timeout: ""
  requestHeaders: {}
  rules: []
  manageWebsiteBindings: true

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Health probes. Disabled by default so existing releases are unaffected.
#
# IIS returns HTTP 503 for a site whose application pool is stopped, so a plain
# httpGet probe detects a stopped app pool without any extra tooling. This also
# makes K8sPodSample.isReady meaningful in New Relic, which the
# "Windows pod not ready" alert condition depends on.
#
# readinessProbe:
#   httpGet:
#     path: /
#     port: http
#   initialDelaySeconds: 30
#   periodSeconds: 30
#   failureThreshold: 3
#
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
#   initialDelaySeconds: 60
#   periodSeconds: 30
#   failureThreshold: 5
#
# For per-app-pool granularity instead of relying on the 503, use an exec probe
# (more expensive - it spawns a PowerShell process on every check):
#
# livenessProbe:
#   exec:
#     command:
#       - powershell.exe
#       - -NoProfile
#       - -Command
#       - "Import-Module WebAdministration; if (Get-ChildItem IIS:\\AppPools | Where-Object { $_.State -ne 'Started' }) { exit 1 } else { exit 0 }"
#   initialDelaySeconds: 60
#   periodSeconds: 30
#   failureThreshold: 3
readinessProbe: {}
livenessProbe: {}
startupProbe: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
