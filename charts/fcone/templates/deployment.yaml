{{- $fullName := include "fconet.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "fconet.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fconet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- /* The WEBSITE- bindings arrive as configMapKeyRef, which the
               container reads only at start. Without this, changing
               httpRoute.hostnames updates the HTTPRoute and the ConfigMap but
               leaves the pod spec byte-identical, so no rollout happens: the
               gateway routes the new hostname while IIS never binds it. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configMap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "fconet.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "fconet.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion | trim }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          {{- $cmData := include "fconet.envConfigMap" . | fromYaml }}
          {{- if or .Values.env $cmData }}
          env:
            {{- /* Same merged set the ConfigMap holds, so a binding derived
                   from httpRoute.hostnames reaches the container as an env var
                   rather than sitting unreferenced in the ConfigMap. */}}
            {{- range $key, $val := $cmData }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name:  {{ $fullName }}-configmap
                  key: {{ $key }}
            {{- end }}
            {{- if and .Values.env .Values.env.secrets }}
            {{- range $key,$value := .Values.env.secrets}}
            - name: {{ $value }}
              valueFrom:
                secretKeyRef:
                  name: {{ $fullName }}-secrets
                  key: {{ $value }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if .Values.secretMounts}}
          volumeMounts:
            - mountPath: {{ .Values.secretMounts.mountPath }}
              name: secret-mount
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.secretMounts}}
      volumes:
        - name: secret-mount
          secret:
            secretName: {{ include "fconet.fullname" . }}-secrets-mount
      {{- end }}
