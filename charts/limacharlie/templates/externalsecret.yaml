apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "limacharlie.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "limacharlie.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.installationKey.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.installationKey.secretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "limacharlie.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: license
      remoteRef:
        key: {{ .Values.installationKey.remoteKey }}
