{{- /* An app's routing on the Gateway, owned by the app, in the same shape as
       the ingress block. The argocd repo's gateway chart keeps the Gateway, its
       listeners and its wildcard certificate; everything specific to one app
       lives here, so onboarding an app needs no commit to the argocd repo.

       Same model as fcone's httproute.yaml minus BackendTLSPolicy: these
       backends serve plain HTTP, so TLS ends at the Gateway exactly as it
       ended at nginx. */}}
{{- if .Values.httpRoute.enabled }}
{{- /* Two sources claiming one hostname make external-dns see two owners and
       the records flap between nginx and the gateway address. Retiring the
       Ingress and enabling the route belong in the same change. */}}
{{- if .Values.ingress.enabled }}{{ fail "ingress.enabled and httpRoute.enabled are both on, so the Ingress and the HTTPRoute would both claim these hostnames; turn ingress.enabled off in the same change that enables the route" }}{{ end }}
{{- $fullName := include "helm.fullname" . }}
{{- $port := .Values.httpRoute.port | default .Values.service.port }}
{{- if not $port }}{{ fail "httpRoute.enabled needs a backend port: set httpRoute.port, or service.port for the whole chart" }}{{ end }}
{{- /* parentRefs is a cross-namespace reference into the argocd repo's gateway
       chart, so nothing here can confirm the Gateway exists. An empty field is
       the one failure visible from here: it silently attaches to nothing. */}}
{{- $gw := .Values.httpRoute.gateway }}
{{- if or (not $gw.name) (not $gw.namespace) (not $gw.sectionName) }}{{ fail "httpRoute.gateway needs name, namespace and sectionName; they must match the Gateway the argocd repo deploys (release fc-gw in namespace fc-gateway, listener https)" }}{{ end }}
{{- /* One app, one route is the common case and stays the plain form: hostnames
       and rules at the top of the block. An app needs several routes when one
       will not hold what it serves -- more than the 16 hostnames a single
       HTTPRoute accepts, or two groups of hostnames wanting different paths,
       since rules apply to every hostname on their route. Both then go in
       httpRoute.routes, and neither case is a reason to move hostnames back
       into the argocd repo. */}}
{{- $routes := .Values.httpRoute.routes | default list }}
{{- if $routes }}
{{- if .Values.httpRoute.hostnames }}{{ fail "httpRoute.hostnames and httpRoute.routes are both set; move those hostnames into a routes entry so one place lists them" }}{{ end }}
{{- if .Values.httpRoute.rules }}{{ fail "httpRoute.rules and httpRoute.routes are both set; rules belong to a route, so move them into the routes entry they apply to" }}{{ end }}
{{- else }}
{{- if not .Values.httpRoute.hostnames }}{{ fail "httpRoute.enabled needs at least one entry in httpRoute.hostnames, or a httpRoute.routes entry carrying them" }}{{ end }}
{{- $routes = list (dict "hostnames" .Values.httpRoute.hostnames "rules" (.Values.httpRoute.rules | default list)) }}
{{- end }}
{{- $seen := dict }}
{{- range $i, $r := $routes }}
{{- if not $r.hostnames }}{{ fail "every httpRoute.routes entry needs its own hostnames" }}{{ end }}
{{- /* Caught here rather than by the API server, which rejects the object with
       a message about an item limit and no hint which route it means. */}}
{{- if gt (len $r.hostnames) 16 }}{{ fail (printf "a single HTTPRoute accepts at most 16 hostnames and this one carries %d; split it across httpRoute.routes entries" (len $r.hostnames)) }}{{ end }}
{{- $rname := $fullName }}
{{- if $r.name }}{{ $rname = printf "%s-%s" $fullName $r.name }}{{ end }}
{{- if hasKey $seen $rname }}{{ fail (printf "two routes would both be named %s; give each httpRoute.routes entry a distinct name, and at most one entry no name at all" $rname) }}{{ end }}
{{- $_ := set $seen $rname true }}
{{- if $i }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $rname }}
  labels:
    {{- include "helm.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: {{ $gw.sectionName }}
  hostnames:
    {{- range $r.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    {{- /* No rules means the whole site, which is what most apps want. */}}
    {{- range $rule := ($r.rules | default (list dict)) }}
    {{- /* A rule overrides its route, which overrides the block default.
           default reads an empty map or string as unset, so an override that
           clears an inherited value has to be found with hasKey. */}}
    {{- $headers := $.Values.httpRoute.requestHeaders }}
    {{- if hasKey $r "requestHeaders" }}{{- $headers = $r.requestHeaders }}{{- end }}
    {{- if hasKey $rule "requestHeaders" }}{{- $headers = $rule.requestHeaders }}{{- end }}
    {{- $timeout := $.Values.httpRoute.timeout }}
    {{- if hasKey $r "timeout" }}{{- $timeout = $r.timeout }}{{- end }}
    {{- if hasKey $rule "timeout" }}{{- $timeout = $rule.timeout }}{{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ $rule.path | default "/" | quote }}
      {{- if or $headers $rule.rewritePrefix }}
      filters:
        {{- if $headers }}
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              {{- range $name, $value := $headers }}
              - name: {{ $name | quote }}
                value: {{ $value | quote }}
              {{- end }}
        {{- end }}
        {{- if $rule.rewritePrefix }}
        {{- /* Replaces nginx's rewrite-target: drops the matched prefix so an
               app served under a subpath still receives the paths it expects. */}}
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: {{ $rule.rewritePrefix | quote }}
        {{- end }}
      {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $port }}
      {{- if $timeout }}
      timeouts:
        request: {{ $timeout | quote }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
